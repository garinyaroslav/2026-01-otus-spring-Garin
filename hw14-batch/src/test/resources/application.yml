spring:
  datasource:
    url: jdbc:h2:mem:maindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  data:
    mongodb:
      uri: mongodb://admin:admin@localhost:27017/testdb?authSource=admin

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

logging:
  level:
    ru.otus.hw.migration: DEBUG
    org.springframework.batch: DEBUG
